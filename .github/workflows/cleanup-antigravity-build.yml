name: cleanup-antigravity-build

on:
  push:
    branches:
      - cleanup/antigravity-0.1.5

permissions:
  contents: write

jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cleanup/antigravity-0.1.5
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Commit refreshed dist when needed
        shell: bash
        run: |
          if git diff --quiet -- dist; then
            echo "dist already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f dist
          git commit -m "build: refresh dist for 0.1.5 cleanup"
          git push
